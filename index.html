  --r:20px; --spring:cubic-bezier(.2,.9,.25,1.15); --ease:cubic-bezier(.2,.8,.2,1);
  --gl:linear-gradient(135deg,var(--sheen),rgba(255,255,255,0) 46%);

  --hl:rgba(255,246,236,.95); --sheen:rgba(255,240,224,.75); --shadow:0 10px 32px rgba(140,80,30,.16),0 1px 2px rgba(140,80,30,.10); --glass:rgba(255,250,244,.6); --sheet:rgba(255,250,245,.92);

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root:root:root{--surface:var(--surface-solid);--glass:var(--surface-solid);--sheet:var(--surface-solid)}}
@media (prefers-reduced-transparency:reduce){:root:root:root{--surface:var(--surface-solid);--glass:var(--surface-solid);--sheet:var(--surface-solid)}}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.022em}
h2{font-size:24px}h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.wrap{max-width:1040px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}

/* Halos de couleur derrière le verre */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.62;will-change:transform}
.blobs i:nth-child(1){width:64vmax;height:64vmax;left:-20vmax;top:-26vmax;background:var(--blob1);animation:drift1 28s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:54vmax;height:54vmax;right:-22vmax;top:16vh;background:var(--blob2);animation:drift2 34s ease-in-out infinite alternate}
.blobs i:nth-child(3){width:48vmax;height:48vmax;left:6vw;bottom:-28vmax;background:var(--blob3);animation:drift1 40s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(9vmax,6vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-8vmax,-5vmax) scale(.92)}}
@media(prefers-reduced-motion:reduce){.blobs i{animation:none}}

/* Verre */
.card,.notice,.mgroup,.blk,.chip,.sheet,.top,.tabs,.toast{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.card,.notice,.mgroup,.blk,.chip{background:var(--gl),var(--surface);border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hl)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);border-bottom:1px solid var(--line);box-shadow:inset 0 -1px 0 var(--hl);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);z-index:10}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:700 18px var(--f-disp);letter-spacing:-.025em;display:flex;align-items:baseline;gap:10px}
.brand small{font:400 12px var(--f-body);color:var(--muted);letter-spacing:0}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;white-space:nowrap;color:var(--ink)}
button.chip{transition:transform .25s var(--spring)}
button.chip:active{transform:scale(.95)}
.chip svg{width:15px;height:15px}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:96px}
.lvl .bar{height:4px}
.sync{font-size:11px;color:var(--muted)}

/* Onglets : capsule flottante */
.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--glass);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow),inset 0 1px 0 var(--hl);display:flex;padding:6px;gap:2px}
.tab{flex:1;min-width:0;background:none;border:0;border-radius:22px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);transition:background .3s var(--ease),color .3s var(--ease),transform .3s var(--spring)}
.tab svg{width:21px;height:21px}
.tab:active{transform:scale(.93)}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft);font-weight:600;box-shadow:inset 0 1px 0 var(--hl),0 2px 10px rgba(0,0,0,.05)}
@media(min-width:760px){
  body{padding-block:0 48px}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:auto;left:auto;right:auto;width:max-content;max-width:100%;margin:12px auto 0;border-radius:999px}
  .tab{flex:0 0 auto;flex-direction:row;gap:7px;padding:8px 16px;font-size:14px}
  .tab svg{width:17px;height:17px}
}
main{padding-block:18px 8px}
main.enter>*{animation:rise .55s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){main.enter>*{animation:none}}

/* Composants */
.card{border-radius:var(--r);padding:18px}
.card.flat{background:transparent}
.card h3+*{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--gl),var(--surface);box-shadow:inset 0 1px 0 var(--hl),0 1px 3px rgba(0,0,0,.05);border-radius:999px;padding:8px 16px;font-weight:500;font-size:14px;min-height:38px;transition:transform .3s var(--spring),box-shadow .25s,filter .25s,border-color .25s}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 80%,#fff),var(--brand));border-color:color-mix(in srgb,var(--brand) 85%,#000);color:var(--brand-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px color-mix(in srgb,var(--brand) 32%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 12px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:32px;height:32px;padding:0;border-radius:50%;border:1px solid transparent;background:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:transform .3s var(--spring),background .2s}
.icon-btn:hover{border-color:var(--line);color:var(--ink);background:var(--surface)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:17px;height:17px}
.bar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 62%,#fff),var(--brand));border-radius:99px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:width .6s var(--ease)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.pill.A{color:var(--bad);border-color:var(--bad)}.pill.B{color:var(--warn);border-color:var(--warn)}
.pill.m1{color:var(--bad);border-color:var(--bad)}.pill.m2{color:var(--warn);border-color:var(--warn)}.pill.m3,.pill.m4{color:var(--good);border-color:var(--good)}
.pill.plan{color:var(--brand);border-color:var(--brand)}
.notice{border-radius:var(--r);padding:13px 16px;--nc:var(--warn);box-shadow:var(--shadow),inset 0 1px 0 var(--hl),inset 4px 0 0 var(--nc)}
.notice.bad{--nc:var(--bad)}.notice.ok{--nc:var(--good)}.notice.info{--nc:var(--brand)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-height:40px;width:100%;color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.04);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--brand)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:700 30px var(--f-disp);letter-spacing:-.03em}
.kpi span{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tscroll{overflow-x:auto}

/* Bande des couches */
.strata{display:flex;flex-direction:column;gap:6px}

    const cat = (mo[m.id] && mo[m.id].cat) || m.cat, heavy = mo[m.id] && mo[m.id].heavy != null ? mo[m.id].heavy : m.heavy;
    const rows = m.cs.map(r => ({ name: r[0], a: r[1], m: r[2], c: r[3] }));

/* ----- Jours d'étude et couches ----- */
/* Volume horaire : semaine type (heures par jour, index 0 = dimanche) et exceptions datées (vacances, garde, voyage) */

  const byMod = {};

  const res = [];
  Object.values(byMod).forEach(list => {

    const s = [...list].sort((x, y) => y.score - x.score || x.i - y.i), nA = s.filter(c => c.tier === "A").length;
    const n = Math.min(s.length, Math.max(LAYER_MIN[k], k === 3 ? Math.ceil(s.length * 0.3) : nA));

  const bySc = (a, b) => b.score - a.score || a.i - b.i;

    const bio = list.filter(c => c.cat === "bio").sort((a, b) => a.mi - b.mi || bySc(a, b));
    const cl = list.filter(c => c.cat !== "bio").sort((a, b) => a.mi - b.mi || bySc(a, b));

  const used = {}; keep.forEach(b => { if (b.s === "p" && b.d && b.d >= t) used[b.d] = (used[b.d] || 0) + b.m; });
  const cfg2 = { ...S.cfg, start: t, dayH: { ...S.cfg.dayH } };
  Object.entries(used).forEach(([d, m]) => { cfg2.dayH[d] = Math.max(0, Math.round((hoursOn(S.cfg, d) - m / 60) * 4) / 4); });
  const skip = new Set(Object.entries(S.prog).filter(([, p]) => p.mastery >= 3).map(([id]) => id));
  keep.forEach(b => { if (b.c && b.t === "cours") skip.add(b.c); });
  S.cfg.start = t; rebuild();
  const g = generatePlan(cfg2, CS, skip); if (o.sg) g.blocks.forEach(b => b.sg = 1);
  S.blocks = [...keep, ...g.blocks]; S.dirty = false; UNDO = null;
  save(); toast((o.sg ? "Proposition prête : " : "Planning prêt : ") + g.blocks.filter(b => b.d).length + " blocs" + (o.sg ? " en pointillés, à accepter ou ignorer" : "") + (g.trimmed ? " · " + g.trimmed + " relectures peu tombables retirées faute de temps" : "")); render();
}

}

/* ===== Planning : Programme → Mois → Semaine → Jour ===== */
const PV = [["prog", "Programme"], ["month", "Mois"], ["week", "Semaine"], ["day", "Jour"]];
const PAUSE = 10;                                         // minutes de pause entre deux blocs
const toMin = t => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const fmtT = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(Math.round(m % 60)).padStart(2, "0");
const INT = () => S.cfg.intern || { on: false, days: [0, 1, 2, 3, 4], start: "08:00", end: "16:00" };
const isIntern = d => INT().on && INT().days.includes(wd(d));
const studyFrom = d => toMin(isIntern(d) ? (S.cfg.studyFrom || {}).intern || "17:00" : (S.cfg.studyFrom || {}).free || "09:00");
const monthEnd = m => { const [Y, M] = m.split("-").map(Number); return new Date(Date.UTC(Y, M, 0)).toISOString().slice(0, 10); };
const monthLabel = m => { const [Y, M] = m.split("-").map(Number); return MOIS[M - 1] + " " + Y; };
const ALL = ["0000-00-00", "9999-12-31"];

/* Horaire d'une journée : internat, puis les blocs l'un après l'autre (ou à l'heure fixée) */
function schedule(d) {
  let cur = studyFrom(d); const out = [];
  blocksOn(d).forEach(b => { const s = b.tm ? toMin(b.tm) : cur; out.push({ b, s, e: s + b.m }); cur = Math.max(cur, s + b.m + PAUSE); });
  return out;
}

/* ----- Propositions : rien n'est imposé ----- */
const isSg = b => b.sg && b.s === "p";
function sgIn(a, b) { return S.blocks.filter(x => isSg(x) && (x.d ? x.d >= a && x.d <= b : a === ALL[0])); }
function acceptRange(a, b) { const l = sgIn(a, b); l.forEach(x => delete x.sg); save(); render(); toast(l.length + " bloc" + (l.length > 1 ? "s" : "") + " accepté" + (l.length > 1 ? "s" : "")); }
function ignoreRange(a, b) { const ids = new Set(sgIn(a, b).map(x => x.id)); S.blocks = S.blocks.filter(x => !ids.has(x.id)); save(); render(); toast(ids.size + " proposition" + (ids.size > 1 ? "s" : "") + " ignorée" + (ids.size > 1 ? "s" : "")); }
function sgBar(a, b, label) {
  const l = sgIn(a, b); if (!l.length) return "";
  return '<div class="notice info"><div class="row between"><div><b>' + l.length + " bloc" + (l.length > 1 ? "s" : "") + " proposé" + (l.length > 1 ? "s" : "") + " " + label + '</b> <span class="muted small">(' + fmtH(l.reduce((s, x) => s + x.m, 0)) + ')</span><div class="small muted">Une proposition n\'est qu\'une suggestion : accepte-la, modifie un bloc, ou ignore-la.</div></div><div class="row" style="gap:6px"><button class="btn sm pri" data-act="sgacc" data-a="' + a + '" data-b="' + b + '">' + ico("check") + ' Accepter</button><button class="btn sm ghost" data-act="sgign" data-a="' + a + '" data-b="' + b + '">Ignorer</button></div></div></div>';
}

  const acc = S.blocks.filter(b => b.d && b.d >= today && b.s === "p" && !b.sg).length;
  openModal('<h3>Proposer un planning</h3><p class="small muted">L\'application prépare une proposition selon tes modules, leurs passages et priorités, tes objectifs et ton temps disponible (semaine type, internat, absences). Elle apparaît en pointillés : tu l\'acceptes en entier, par mois, par semaine ou par jour, tu la modifies ou tu l\'ignores.</p>' +
    (acc ? '<label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" id="prrep">Remplacer aussi mes ' + acc + ' blocs acceptés à venir (sauf ceux que j\'ai placés ou verrouillés moi-même)</label><p class="tiny muted">Sinon, la proposition ne remplit que le temps encore libre.</p>' : "") +

  return '<div class="card"><div class="sec-h"><h3>' + title + '</h3><span class="muted small mono">' + done + " / " + gs.length + "</span></div>" +

}
function addGoal(k) { const i = document.querySelector('[data-gi="' + k + '"]'), t = i && i.value.trim(); if (!t) return; (S.goals = S.goals || []).push({ id: uid(), k, t, done: 0 }); save(); render(); }

/* ----- Répartir un module sur un mois (proposition) ----- */
function spreadModule(mid, m) {
  const a = m + "-01" > today ? m + "-01" : today, days = studyDays(a, monthEnd(m), S.cfg);
  const planned = new Set(S.blocks.filter(b => b.c && b.t === "cours" && !isSg(b) && (b.s === "d" || b.d >= today)).map(b => b.c));
  const cs = CS.filter(c => c.mid === mid && !c.off && !((S.prog[c.id] || {}).mastery >= 3) && !planned.has(c.id)).sort((x, y) => x.i - y.i);
  let di = 0, n = 0;
  for (const c of cs) {
    const cm = Math.max(20, Math.min(120, r5(c.load * 28))), qm = Math.max(15, r5(cm * 0.5));
    while (di < days.length && cap(days[di]) - dayLoad(days[di]) < cm + qm) di++;
    if (di >= days.length) break;
    const d = days[di], l = layerOf(d, LAY);
    S.blocks = S.blocks.filter(b => !(isSg(b) && b.c === c.id && (b.t === "cours" || b.t === "qcm") && b.l === layerOf(d, LAY)));   // la proposition remplace l'ancienne pour ce cours
    S.blocks.push({ id: uid(), d, c: c.id, t: "cours", m: cm, s: "p", l, o: 900 + n, sg: 1, ma: 1 }, { id: uid(), d, c: c.id, t: "qcm", m: qm, s: "p", l, o: 901 + n, sg: 1, ma: 1 }); n++;
  }
  const f = (S.focus = S.focus || {}); f[m] = [...new Set([...(f[m] || []), mid])];
  save(); render();
  toast(n ? n + " cours de " + modName(mid) + " proposés en " + monthLabel(m) + (n < cs.length ? " · " + (cs.length - n) + " ne rentrent pas ce mois-ci" : "") : cs.length ? "Plus de temps libre ce mois-ci" : "Tous les cours de ce module sont déjà planifiés ou maîtrisés");
}

  const crumbs = [["prog", "Programme"], ["month", monthLabel(m)], ["week", "Semaine du " + fmtD(ws, "short")], ["day", fmtD(d, "long")]];
  return '<div class="card"><div class="row between"><div class="seg" role="tablist" aria-label="Niveau du planning">' + (S.wiz ? [["wiz", "Assistant"], ...PV] : PV).map(p => '<button data-act="pvgo" data-pv="' + p[0] + '" aria-pressed="' + (pv === p[0]) + '">' + p[1] + "</button>").join("") + '</div><div class="row" style="gap:6px"><button class="btn sm pri" data-act="ftopen">' + ico("flag") + ' Fast Track</button><button class="btn sm" data-act="scratch">' + ico("undo") + ' Repartir de zéro</button><button class="btn sm" data-act="propose">' + ico("spark") + ' Proposer un planning</button><button class="btn sm" data-act="replan">Rattraper le retard</button>' + (UNDO && pv !== "wiz" ? '<button class="btn sm ghost" data-act="' + (UNDO.ft ? "ftundo" : "undoreplan") + '">' + ico("undo") + " Annuler</button>" : "") + "</div></div>" +
    (pv === "wiz" ? "" : '<nav class="tiny muted" style="margin-top:10px" aria-label="Fil d\'Ariane">') + (pv === "wiz" ? [] : crumbs.slice(0, PV.findIndex(p => p[0] === pv) + 1)).map((c, i, a) => i < a.length - 1 ? '<button class="btn ghost sm" style="padding:2px 6px;min-height:0" data-act="pvgo" data-pv="' + c[0] + '">' + esc(c[1]) + "</button> › " : "<b>" + esc(c[1]) + "</b>").join("") + (pv === "wiz" ? "" : "</nav>") + "</div>";
}
function vPlan() {
  const pv = ui.pv || "month";
  return '<div class="stack">' + planNav() + (pv === "wiz" ? wizView() : pv === "prog" ? vProgramme() : pv === "week" ? vWeek() : pv === "day" ? vDay(ui.day || today) : vMonth()) + "</div>";
}

/* ----- Programme ----- */
function vProgramme() {
  const first = (LAY[0].start < today ? LAY[0].start : today).slice(0, 7), last = S.cfg.exam.slice(0, 7), months = [];
  for (let m = first; m <= last;) { months.push(m); const [Y, M] = m.split("-").map(Number); m = new Date(Date.UTC(Y, M, 1)).toISOString().slice(0, 7); }
  const by = {}; S.blocks.forEach(b => { if (b.d) (by[b.d.slice(0, 7)] = by[b.d.slice(0, 7)] || []).push(b); });
  const act = CS.filter(c => !c.off), firstDone = new Set(S.blocks.filter(b => b.s === "d" && b.c && (b.t === "cours" || b.t === "rev")).map(b => b.c));
  let h = '<div class="card">' + strataHtml() + '<div class="grid g3" style="margin-top:14px"><div class="kpi"><b class="mono">' + Math.round(act.filter(c => firstDone.has(c.id)).length / Math.max(1, act.length) * 100) + ' %</b><span>du programme vu au moins une fois</span></div><div class="kpi"><b class="mono">' + modulesLeft().length + '</b><span>modules à terminer (1er passage)</span></div><div class="kpi"><b class="mono">' + Math.max(0, diffD(today, S.cfg.exam)) + "</b><span>jours avant le concours</span></div></div></div>";
  h += sgBar(ALL[0], ALL[1], "sur tout le programme");
  h += '<div class="stack" style="gap:10px">' + months.map(m => {
    const bs = by[m] || [], tot = bs.reduce((s, b) => s + b.m, 0), dn = bs.filter(b => b.s === "d").reduce((s, b) => s + (b.dm || b.m), 0), sg = bs.filter(isSg).length;
    const mods = {}; bs.forEach(b => { const c = b.c && CM[b.c]; if (c) mods[c.mid] = (mods[c.mid] || 0) + b.m; });
    const top = Object.entries(mods).sort((a, b) => b[1] - a[1]).slice(0, 4), gs = (S.goals || []).filter(g => g.k === "m:" + m), lay = layerOf(m + "-15", LAY);
    return '<button class="card" style="text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer' + (m === today.slice(0, 7) ? ";outline:2px solid var(--brand);outline-offset:-2px" : "") + '" data-act="pvgo" data-pv="month" data-m="' + m + '"><div class="row between"><b style="text-transform:capitalize">' + monthLabel(m) + '</b><span class="small muted">' + (lay <= 4 ? "Couche " + lay : "Tampon") + " · " + fmtH(tot) + (sg ? " · " + sg + " proposés" : "") + (gs.length ? " · objectifs " + gs.filter(g => g.done).length + "/" + gs.length : "") + '</span></div><div class="bar"><i style="width:' + Math.round(dn / Math.max(1, tot) * 100) + '%"></i></div><div class="row" style="gap:6px">' + (top.length ? top.map(([mid, v]) => '<span class="pill">' + esc(modName(mid)) + " · " + Math.round(v / 60) + " h</span>").join("") : '<span class="small muted">Rien de planifié</span>') + "</div></button>";
  }).join("") + "</div>";
  return h;
}

/* ----- Mois ----- */
function vMonth() {

  const off = (wd(first) + 6) % 7, gs = addD(first, -off), by = {};
  S.blocks.forEach(b => { if (b.d) (by[b.d] = by[b.d] || []).push(b); });
  const sel = ui.day && ui.day.slice(0, 7) === m ? ui.day : (today.slice(0, 7) === m ? today : first);
  let h = sgBar(first, me, "en " + monthLabel(m));
  h += '<div class="card"><div class="row between" style="margin-bottom:10px"><div class="row" style="gap:4px"><button class="icon-btn" data-act="mnav" data-n="-1" aria-label="Mois précédent">' + ico("left") + '</button><h3 style="min-width:150px;text-align:center;text-transform:capitalize">' + monthLabel(m) + '</h3><button class="icon-btn" data-act="mnav" data-n="1" aria-label="Mois suivant">' + ico("right") + '</button></div><button class="btn sm ghost" data-act="mtoday">Aujourd\'hui</button></div><div class="cal">' +
    ["lun.", "mar.", "mer.", "jeu.", "ven.", "sam.", "dim."].map(x => '<div class="dh">' + x + "</div>").join("");
  for (let i = 0; i < 42; i++) {
    const d = addD(gs, i), lkd = T().horizon && d > addD(today, T().horizon), bs = lkd ? [] : (by[d] || []).sort(byO), min = bs.reduce((s, b) => s + b.m, 0), inM = d.slice(0, 7) === m, lay = d < LAY[0].start ? 1 : layerOf(d, LAY), isRest = isOff(d);
    if (i >= 35 && !inM && d > me) break;
    h += '<div class="cell l' + lay + (inM ? "" : " out") + (isRest ? " rest" : "") + (d === today ? " today" : "") + (d === sel ? " sel" : "") + (lkd ? " locked" : "") + '" data-act="day" data-d="' + d + '" tabindex="0" role="button" aria-label="' + fmtD(d, "long") + '"><div class="cc"><span class="dn">' + D(d).getUTCDate() + (isIntern(d) ? '<i class="intdot" title="Internat"></i>' : "") + '</span><span class="hrs' + (min > cap(d) ? " bad" : "") + '">' + (min ? Math.round(min / 6) / 10 + " h" : "") + "</span></div>" +
      bs.slice(0, 3).map(b => '<span class="cchip t-' + b.t + (b.s === "d" ? " d" : "") + (isSg(b) ? " sg" : "") + '" draggable="true" data-drag="' + b.id + '" title="' + esc(titleOf(b)) + '">' + esc(titleOf(b)) + "</span>").join("") + (bs.length > 3 ? '<span class="more">+ ' + (bs.length - 3) + "</span>" : "") +
      (lkd ? '<span class="lk">' + ico("lock") + "</span>" : "") + '<span class="dots">' + bs.slice(0, 6).map(b => '<i class="dot t-' + b.t + '"></i>').join("") + "</span></div>";
  }
  h += '</div><p class="tiny muted" style="margin-top:10px">Pointillés : blocs proposés. Point bleu : jour d\'internat. Glisse un bloc sur un autre jour pour le déplacer.</p></div>';
  // jour choisi
  const dayB = (by[sel] || []).sort(byO), dl = dayB.reduce((s, b) => s + b.m, 0);
  h += '<div class="card"><div class="row between"><div><div class="eyebrow">Jour choisi</div><h3 style="margin-top:2px">' + fmtD(sel, "long") + '</h3><span class="small muted">' + fmtH(dl) + " planifiées sur " + fmtH(cap(sel)) + " disponibles" + (isIntern(sel) ? " · internat " + INT().start + "–" + INT().end : "") + '</span></div><div class="row" style="gap:6px"><button class="btn sm" data-act="pvgo" data-pv="day" data-d="' + sel + '">Ouvrir la journée</button><button class="btn sm" data-act="pvgo" data-pv="week" data-d="' + sel + '">Voir la semaine</button><button class="btn sm" data-act="add" data-d="' + sel + '">' + ico("plus") + "</button></div></div>" +
    (dayB.length ? '<ul class="blks" style="margin-top:12px">' + dayB.map(b => blockRow(b, { order: true })).join("") + "</ul>" : '<p class="small muted" style="margin-top:10px">' + (isOff(sel) ? (S.cfg.dayN[sel] ? esc(S.cfg.dayN[sel]) + " : pas d'étude prévue." : "Jour de repos.") : "Aucun bloc ce jour.") + "</p>") + "</div>";
  // modules du mois et objectifs
  const mods = {}; Object.keys(by).filter(d => d.slice(0, 7) === m).forEach(d => by[d].forEach(b => { const c = b.c && CM[b.c]; if (c) { const x = mods[c.mid] = mods[c.mid] || [0, 0]; x[0] += b.m; if (b.s === "d") x[1] += b.dm || b.m; } }));
  const focus = (S.focus || {})[m] || [], ids = [...new Set([...focus, ...Object.keys(mods)])].sort((a, b) => ((mods[b] || [0])[0]) - ((mods[a] || [0])[0]));
  h += '<div class="grid g2">' + goalsCard("m:" + m, "Objectifs de " + monthLabel(m)) +
    '<div class="card"><div class="sec-h"><h3>Modules du mois</h3><span class="muted small">' + ids.length + "</span></div>" +
    (ids.length ? '<div class="stack" style="gap:8px">' + ids.slice(0, 12).map(mid => { const x = mods[mid] || [0, 0]; return '<div><div class="row between small"><span>' + esc(modName(mid)) + (focus.includes(mid) ? ' <span class="pill plan">objectif</span>' : "") + '</span><span class="mono muted">' + fmtH(x[1]) + " / " + fmtH(x[0]) + '</span></div><div class="bar" style="margin-top:3px"><i style="width:' + Math.round(x[1] / Math.max(1, x[0]) * 100) + '%"></i></div></div>'; }).join("") + "</div>" : '<p class="small muted">Aucun module planifié ce mois-ci.</p>') +
    '<div class="eyebrow" style="margin:14px 0 6px">Répartir un module sur ce mois</div><div class="row" style="flex-wrap:nowrap"><select id="spm">' + MODS.filter(x => !(S.modOver[x.id] || {}).off).map(x => '<option value="' + x.id + '">' + esc(x.name) + "</option>").join("") + '</select><button class="btn sm" data-act="spread" data-m="' + m + '">Proposer</button></div><p class="tiny muted" style="margin-top:6px">Place ses cours non encore planifiés sur le temps libre du mois, en proposition.</p></div></div>';
  // semaines du mois
  const weeks = []; for (let w = wkStart(first); w <= me; w = addD(w, 7)) weeks.push(w);
  h += '<div class="card"><h3>Semaines</h3><div class="row" style="gap:6px;margin-top:10px">' + weeks.map(w => { let t = 0, dn = 0; for (let i = 0; i < 7; i++) (by[addD(w, i)] || []).forEach(b => { t += b.m; if (b.s === "d") dn += b.dm || b.m; }); return '<button class="btn sm" data-act="pvgo" data-pv="week" data-d="' + w + '">' + fmtD(w, "short") + " → " + fmtD(addD(w, 6), "short") + ' <span class="muted mono">' + Math.round(t / 60) + " h</span></button>"; }).join("") + "</div></div>";
  const back = S.blocks.filter(b => !b.d);
  if (back.length) h += '<div class="card"><div class="sec-h"><h3>En attente</h3><span class="muted small">' + back.length + " blocs · " + fmtH(back.reduce((s, b) => s + b.m, 0)) + '</span></div><ul class="blks">' + back.slice(0, 20).map(b => '<li class="blk t-' + b.t + '"><div class="bi"><div class="bt">' + esc(titleOf(b)) + '</div><div class="bs">' + subOf(b) + '</div></div><div class="ba"><button class="btn sm" data-act="edit" data-id="' + b.id + '">Placer</button><button class="icon-btn" data-act="bdel" data-id="' + b.id + '" aria-label="Supprimer">' + ico("trash") + "</button></div></li>").join("") + "</ul>" + (back.length > 20 ? '<p class="muted small" style="margin-top:8px">+ ' + (back.length - 20) + " autres.</p>" : "") + '<div class="row" style="margin-top:10px"><button class="btn sm" data-act="replan">Replacer automatiquement</button></div></div>';
  return h;
}

/* ----- Semaine ----- */
function vWeek() {
  const ws = ui.pw || wkStart(today), we = addD(ws, 6), days = [0, 1, 2, 3, 4, 5, 6].map(i => addD(ws, i));
  let tot = 0, dn = 0, qT = 0, qD = 0, nC = 0;
  days.forEach(d => blocksOn(d).forEach(b => { tot += b.m; if (b.s === "d") dn += b.dm || b.m; if (b.t === "qcm") { qT += qTarget(b); qD += b.qd || 0; } if (b.t === "cours") nC++; }));
  let h = sgBar(ws, we, "cette semaine");
  h += '<div class="card"><div class="row between"><div class="row" style="gap:4px"><button class="icon-btn" data-act="wknav" data-n="-1" aria-label="Semaine précédente">' + ico("left") + '</button><h3 style="min-width:180px;text-align:center">' + fmtD(ws, "short") + " → " + fmtD(we, "short") + '</h3><button class="icon-btn" data-act="wknav" data-n="1" aria-label="Semaine suivante">' + ico("right") + '</button></div><div class="row" style="gap:14px"><span class="small"><b class="mono">' + fmtH(dn) + "</b> / " + fmtH(tot) + '</span><span class="small">QCM <b class="mono">' + qD + "</b> / " + qT + '</span><span class="small">' + nC + " cours</span></div></div>" +
    '<div class="wgrid" style="margin-top:12px">' + days.map(d => {
      const sc = schedule(d), load = sc.reduce((s, x) => s + x.b.m, 0), end = sc.length ? sc[sc.length - 1].e : 0;
      return '<div class="wcol' + (d === today ? " today" : "") + (isOff(d) ? " rest" : "") + '" data-d="' + d + '"><button class="wh" data-act="pvgo" data-pv="day" data-d="' + d + '"><b style="text-transform:capitalize">' + JOURS[wd(d)].slice(0, 3) + ". " + D(d).getUTCDate() + '</b><span class="tiny mono' + (load > cap(d) ? " bad" : " muted") + '">' + (Math.round(load / 6) / 10) + " / " + (Math.round(cap(d) / 6) / 10) + " h</span></button>" +
        (isIntern(d) ? '<div class="wint">Internat ' + INT().start + "–" + INT().end + "</div>" : "") +
        sc.map(x => '<div class="wb t-' + x.b.t + (x.b.s === "d" ? " d" : "") + (isSg(x.b) ? " sg" : "") + '" draggable="true" data-drag="' + x.b.id + '" data-act="edit" data-id="' + x.b.id + '" tabindex="0" role="button"><span class="tiny mono muted">' + fmtT(x.s) + '</span><span class="wt">' + (x.b.t !== "cours" && x.b.c ? "<b>" + TYPE_LABEL[x.b.t] + "</b> · " : "") + esc(titleOf(x.b)) + "</span></div>").join("") +
        (end > 23 * 60 ? '<div class="tiny" style="color:var(--bad)">Finit à ' + fmtT(end) + "</div>" : "") +
        '<button class="btn sm ghost" style="width:100%" data-act="add" data-d="' + d + '">' + ico("plus") + "</button></div>";
    }).join("") + '</div><p class="tiny muted" style="margin-top:10px">Glisse un bloc d\'un jour à l\'autre. Touche un bloc pour le modifier, un jour pour l\'ouvrir.</p></div>';
  h += goalsCard("w:" + ws, "Objectifs de la semaine");
  return h;
}

/* ----- Jour ----- */
function dayTimeline(d) {
  const sc = schedule(d), intern = isIntern(d);
  if (!sc.length && !intern) return "";
  let rows = [];
  if (intern) rows.push({ s: toMin(INT().start), html: '<li class="blk t-int"><div class="bi"><div class="bt">Internat</div><div class="bs">' + INT().start + " – " + INT().end + "</div></div></li>" });
  sc.forEach(x => rows.push({ s: x.s, html: blockRow(x.b, { order: true, postpone: true, time: fmtT(x.s) + " – " + fmtT(x.e) }) }));
  rows.sort((a, b) => a.s - b.s);
  return '<ul class="blks">' + rows.map(r => r.html).join("") + "</ul>";
}
function lateList() {
  const late = S.blocks.filter(b => b.d && b.d < today && b.s === "p" && !b.sg).sort((a, b) => a.d.localeCompare(b.d));
  if (!late.length) return "";
  return '<div class="card"><div class="row between"><div><h3>' + late.length + ' tâche' + (late.length > 1 ? "s" : "") + ' non terminée' + (late.length > 1 ? "s" : "") + '</h3><p class="small muted">' + fmtH(late.reduce((s, b) => s + b.m, 0)) + ' de retard. Ramène une tâche à aujourd\'hui, reporte-la, ou laisse l\'application proposer un rattrapage.</p></div><button class="btn pri" data-act="replan">Proposer un rattrapage</button></div>' +
    '<ul class="blks" style="margin-top:12px">' + late.slice(0, 6).map(b => '<li class="blk t-' + b.t + '"><div class="bi"><div class="bt">' + esc(titleOf(b)) + '</div><div class="bs">' + subOf(b) + " · prévu le " + fmtD(b.d, "short") + '</div></div><div class="ba"><button class="btn sm" data-act="lmove" data-id="' + b.id + '">Aujourd\'hui</button><button class="btn sm ghost" data-act="postpone" data-id="' + b.id + '">Reporter</button></div></li>').join("") + "</ul>" + (late.length > 6 ? '<p class="small muted" style="margin-top:8px">+ ' + (late.length - 6) + " autres.</p>" : "") + "</div>";
}
function vDay(d) {
  const bl = blocksOn(d), tot = bl.reduce((s, b) => s + b.m, 0), dn = bl.filter(b => b.s === "d").reduce((s, b) => s + (b.dm || b.m), 0);
  const qT = bl.filter(b => b.t === "qcm").reduce((s, b) => s + qTarget(b), 0), qD = bl.reduce((s, b) => s + (b.qd || 0), 0);
  let h = sgBar(d, d, "ce jour");
  if (d === today) h += lateList();
  h += '<div class="card"><div class="row between"><div class="row" style="gap:4px"><button class="icon-btn" data-act="dnav" data-n="-1" aria-label="Jour précédent">' + ico("left") + '</button><h3 style="min-width:200px;text-align:center;text-transform:capitalize">' + fmtD(d, "long") + '</h3><button class="icon-btn" data-act="dnav" data-n="1" aria-label="Jour suivant">' + ico("right") + '</button></div><div class="row" style="gap:14px"><span class="small"><b class="mono">' + fmtH(dn) + "</b> / " + fmtH(tot) + '</span><span class="small">QCM <b class="mono">' + qD + "</b> / " + qT + '</span><button class="btn sm" data-act="add" data-d="' + d + '">' + ico("plus") + ' Ajouter une tâche</button></div></div><div style="margin-top:12px">' +
    (dayTimeline(d) || '<p class="small muted">' + (isOff(d) ? (S.cfg.dayN[d] ? esc(S.cfg.dayN[d]) + " : pas d'étude prévue." : "Jour de repos.") : "Aucune tâche ce jour.") + "</p>") + "</div>" +
    (bl.length ? '<p class="tiny muted" style="margin-top:10px">Début des études : ' + fmtT(studyFrom(d)) + ", " + PAUSE + " min de pause entre deux blocs. Fixe une heure précise en modifiant un bloc.</p>" : "") + "</div>";
  return h;
}

/* ----- QCM, révisions, modules ----- */
const qTarget = b => b.t === "exam" ? 120 : Math.max(5, Math.round(b.m / 1.5));
function addRev(cid, d, o) {
  o = o || {};
  if (!CM[cid]) return;
  if (o.auto) S.blocks = S.blocks.filter(b => !(b.c === cid && b.t === "rev" && b.s === "p" && b.n === "révision espacée" && b.d >= today));
  let x = d < today ? today : d; if (isOff(x)) x = nextStudyDay(x);
  const b = { id: uid(), d: x, c: cid, t: "rev", m: Math.max(15, Math.min(45, r5(CM[cid].load * 10))), s: "p", l: layerOf(x, LAY), o: 950, ma: 1 };
  if (o.auto) b.n = "révision espacée"; if (o.sg) b.sg = 1;
  S.blocks.push(b); return b;
}
function autoRev(cid) {
  const mode = S.cfg.autoRev || "suggest", p = S.prog[cid];
  if (mode === "off" || !p || !p.due) return;
  addRev(cid, p.due, { auto: 1, sg: mode === "suggest" });
}
function modulesLeft() {
  const seen = new Set(S.blocks.filter(b => b.s === "d" && b.c && (b.t === "cours" || b.t === "rev")).map(b => b.c));
  return MODS.filter(m => !(S.modOver[m.id] || {}).off).map(m => { const cs = CS.filter(c => c.mid === m.id && !c.off); const n = cs.filter(c => seen.has(c.id) || (S.prog[c.id] || {}).mastery > 0).length; return { m, n, tot: cs.length }; }).filter(x => x.tot && x.n < x.tot);
}
function rentables(n) {
  return CS.filter(c => !c.off && !((S.prog[c.id] || {}).mastery >= 3)).map(c => ({ c, r: c.score * (1 - ((S.prog[c.id] || {}).mastery || 0) / 4) / Math.sqrt(Math.max(0.6, c.load)) })).sort((a, b) => b.r - a.r).slice(0, n);
}

/* ===== Assistant : repartir de zéro, puis mois → semaines → jours =====
   L'application propose, l'étudiant décide à chaque étape. Une « unité » = un passage d'un cours (cours ou révision + ses QCM),
   un examen blanc ou un carnet d'erreurs. */
const WZ = () => S.wiz;
let UNDO_WIZ = null;
const uMin = u => u.m + (u.q || 0);
const uTitle = u => u.t === "exam" ? "Examen blanc" : u.c ? (CM[u.c] ? CM[u.c].name : "Cours retiré") : (u.n || "Carnet d'erreurs");
const uMod = u => u.t === "exam" ? "_exam" : u.c && CM[u.c] ? CM[u.c].mid : "_libre";
const uModName = k => k === "_exam" ? "Examens blancs" : k === "_libre" ? "Carnet d'erreurs" : modName(k);
function wizMonthsList() {
  const first = (S.cfg.start > today ? S.cfg.start : today).slice(0, 7), last = S.cfg.exam.slice(0, 7), out = [];
  for (let m = first; m <= last;) { out.push(m); const [Y, M] = m.split("-").map(Number); m = new Date(Date.UTC(Y, M, 1)).toISOString().slice(0, 7); }

function placeDays(w, m, quiet) {
  const W = WZ(), k = w + "|" + m;
  S.blocks = S.blocks.filter(b => !(isSg(b) && b.wz === k));
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addD(w, i)).filter(d => d.slice(0, 7) === m && d >= today && d <= S.cfg.exam && cap(d) > 0);
  if (!days.length) return toast("Plus aucun jour d'étude disponible cette semaine");
  const used = {}; days.forEach(d => used[d] = cap(d) - dayFree(d));
  let di = 0, ord = 0, n = 0;
  const room = d => cap(d) - used[d];
  const put = (u, t, mins) => {
    while (mins > 0) {
      while (di < days.length - 1 && room(days[di]) < Math.min(15, mins)) di++;
      const d = days[di], part = di === days.length - 1 ? mins : Math.min(mins, Math.max(15, room(d)));
      S.blocks.push({ id: uid(), d, c: u.c, t, m: part, s: "p", l: Math.min(5, u.l || layerOf(d, LAY)), o: 800 + ord++, sg: 1, wz: k, ...(u.n ? { n: u.n } : {}), ...(part < mins ? { n: "suite" } : {}) });

    if (u.t === "exam") { const d = days.find(x => room(x) >= Math.min(EXAM_MIN, cap(x))) || days[days.length - 1]; S.blocks.push({ id: uid(), d, c: null, t: "exam", m: Math.min(EXAM_MIN, cap(d)), s: "p", l: u.l, o: 800 + ord++, sg: 1, wz: k }); used[d] += Math.min(EXAM_MIN, cap(d)); n++; return; }
    put(u, u.t === "libre" ? "libre" : u.t, u.m); if (u.q) put(u, "qcm", u.q);
  });

}

    case "sqg": S.cfg.quizGoal = Math.max(5, Math.min(120, +v || 15)); save(); return toast("Objectif enregistré");
    case "demo": S.plan.demo = el.checked; save(); return render();
    case "qdiff": q.diff = v; return;
    case "mcat": if (!can("edit")) { upsell("edit"); return render(); } S.modOver[el.dataset.id] = { ...S.modOver[el.dataset.id], cat: v }; return courseDirty();
    case "moff": if (!can("edit")) { upsell("edit"); return render(); } S.modOver[el.dataset.id] = { ...S.modOver[el.dataset.id], off: !el.checked }; return courseDirty();
    case "mheavy": if (!can("edit")) { upsell("edit"); return render(); } S.modOver[el.dataset.id] = { ...S.modOver[el.dataset.id], heavy: el.checked }; return courseDirty();
    case "mpass": if (!can("edit")) { upsell("edit"); return render(); } { const o = { ...S.modOver[el.dataset.id] }; if (v) o.passes = +v; else delete o.passes; S.modOver[el.dataset.id] = o; } return courseDirty();
    case "coff": if (!can("edit")) { upsell("edit"); return render(); } if (el.checked) delete S.courseOff[el.dataset.id]; else S.courseOff[el.dataset.id] = 1; return courseDirty();
    case "qscope": q.scope = v; q.err = ""; return render();
    case "qmod": q.mid = v; q.cid = ""; return render();
    case "qcid": q.cid = v; return;
    case "qnum": q.n = +v; return;
    case "qkind": q.kind = v; return;
  }
});
let ft = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "qx") QZ().extract = el.value;
  if (el.id === "nem") { ui.nem = el.value; ui.pick = null; suggest(el.value); }
  if (el.dataset && el.dataset.act === "afilter") { ui.afilter = el.value; clearTimeout(ft); ft = setTimeout(() => { render(); const f = $("#af"); if (f) { f.focus(); const n = f.value.length; f.setSelectionRange(n, n); } }, 250); }
  if (el.dataset && el.dataset.act === "cfilter") { ui.filter = el.value; clearTimeout(ft); ft = setTimeout(() => { render(); const f = $("#cf"); if (f) { f.focus(); const n = f.value.length; f.setSelectionRange(n, n); } }, 250); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").innerHTML) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[tabindex][data-act]")) { e.preventDefault(); e.target.click(); }
});
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-drag]"); if (c) { dragId = c.dataset.drag; try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch (x) { } } });
document.addEventListener("dragover", e => { if (dragId && e.target.closest && e.target.closest(".cell,.wcol")) e.preventDefault(); });
document.addEventListener("drop", e => { const c = e.target.closest && e.target.closest(".cell,.wcol"); if (dragId && c) { e.preventDefault(); const id = dragId; dragId = null; if (gate("edit")) moveBlock(id, c.dataset.d); } });
document.addEventListener("dragend", () => { dragId = null; });

/* ----- Affichage et démarrage ----- */
const VIEWS = { welcome: vWelcome, admin: vAdmin, acc: vAcc, today: vToday, plan: vPlan, prog: vProg, quiz: vQuiz, cours: vCours, set: vSet };
function render() { applyPal(); renderHeader(); if (view === "admin" && !STAFF()) view = "today"; $("#view").innerHTML = (REAL_STAFF() && ui.as ? '<div class="notice info" style="margin-bottom:16px"><div class="row between"><span>Aperçu : tu vois l\'application comme ' + (ui.as === "guest" ? "une personne qui vient de s\'inscrire" : "un utilisateur " + PLANS[ui.as].name) + ". Tes actions modifient quand même ton propre planning.</span><button class=\"btn sm\" data-act=\"asme\">Revenir à ma vue</button></div></div>" : "") + VIEWS[needWelcome() ? "welcome" : view](); }

async function boot() {
  let loaded = false;
  try { const raw = localStorage.getItem(KEY); if (raw) { S = migrate(deserialize(raw)); rebuild(); loaded = true; } } catch (e) { loaded = false; }
  if (!loaded) { freshState(); }
  ui.quiz = qDefault(); applyPal(); render(); enter(); if (!loaded) { save(); S.ts = 0; } else upgradeData();   // état neuf : le compte en ligne doit l'emporter
  if (!(window.claude && claude.use)) { NOID = true; CAPS_DONE = true; render(); return; }
  const tryUse = n => claude.use(n).catch(() => null);
  const [db, user, sample, dl] = await Promise.all([tryUse("db"), tryUse("user"), tryUse("sample"), tryUse("downloads")]);
  SAMPLE = sample; DOWNLOADS = dl; USER = user;
  if (user) { try { ui.me = await user.me(); } catch (e) { } }
  if (db && user && user.id) {
    try {
      UID = await user.id();
      if (UID && S.uid && S.uid !== UID) { freshState(); S.ts = 0; ui.quiz = qDefault(); }   // autre compte sur cet appareil : on ne mélange pas les données
      if (UID) {
        S.uid = UID;
        DB = db;
        const own = await user.isOwner(); ROLE = own ? "owner" : "user";
        if (!own) { await loadAdmins(); if (ADMINS.some(a => a.uid === UID)) ROLE = "admin"; }
        try { const m = await DB.doc("members/" + UID).get(); MEMBER = m.exists ? m.data() : null; } catch (e) { }
        DB.doc("access/" + UID).onSnapshot(sn => { const n = sn.exists ? sn.data() : null; if (JSON.stringify(n) !== JSON.stringify(ACC)) { ACC = n; render(); } }, () => { });
        const r = await loadRemote();
        if (r === "remote") { applyPal(); if (!upgradeData()) toast("Données synchronisées"); } else if (r !== "same") persist();
        if (S.profile.pseudo && !MEMBER) ensureMember();
      }
    } catch (e) { DB = null; UID = null; ROLE = "local"; }
  }
  if (!UID) NOID = true;
  CAPS_DONE = true;
  render();
}
boot();

</script>
